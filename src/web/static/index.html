<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>super-code · P1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1b1e; color: #c9c9c9; height: 100vh; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { color: #a78bfa; }
  .msg.ai { color: #c9c9c9; }
  .msg.thinking { color: #707070; font-style: italic; }
  .msg.tool { color: #4ade80; font-size: 13px; padding: 4px 8px; background: #25262b; border-radius: 4px; }
  .msg.error { color: #f87171; }
  .input-area { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid #2c2e33; }
  .input-area textarea { flex: 1; background: #1e1f22; border: 1px solid #2c2e33; border-radius: 8px; padding: 10px 14px; color: #e0e0e0; font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 40px; max-height: 120px; }
  .input-area textarea:focus { border-color: #7c5cbf; }
  .input-area button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-send { background: #a78bfa; color: #fff; }
  .btn-stop { background: #2c2e33; color: #c9c9c9; }
  /* 权限确认弹窗 */
  #perm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
  #perm-overlay.show { display: flex; }
  #perm-box { background: #1e1f22; border: 1px solid #3c3e44; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  #perm-box h3 { color: #fbbf24; font-size: 16px; margin-bottom: 12px; }
  #perm-box .perm-params { font-size: 13px; color: #a0a0a0; margin-bottom: 16px; max-height: 200px; overflow-y: auto; }
  #perm-box .perm-params pre { margin: 4px 0 0 0; padding: 8px; background: #25262b; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  #perm-box .perm-btns { display: flex; gap: 8px; justify-content: flex-end; }
  #perm-box .perm-btns button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-deny { background: #3c1f1f; color: #f87171; }
  .btn-allow { background: #1f3c1f; color: #4ade80; }
  .btn-always { background: #1f2f3c; color: #60a5fa; }
</style>
</head>
<body>
<div id="chat"></div>
<div class="input-area">
  <textarea id="input" rows="1" placeholder="输入消息… (Enter 发送)"></textarea>
  <button class="btn-stop" onclick="stop()">停止</button>
  <button class="btn-send" onclick="send()">发送</button>
</div>
<div id="perm-overlay">
  <div id="perm-box">
    <h3 id="perm-title">权限确认</h3>
    <div class="perm-params" id="perm-params"></div>
    <div class="perm-btns">
      <button class="btn-deny" onclick="resolvePerm('deny')">拒绝</button>
      <button class="btn-allow" onclick="resolvePerm('allow')">允许</button>
      <button class="btn-always" onclick="resolvePerm('always')">始终允许</button>
    </div>
  </div>
</div>
<script>
  const chat = document.getElementById('chat');
  const ta = document.getElementById('input');
  let ws = null, connected = false;

  function add(type, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + type;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function connect() {
    // 创建会话 → 获取 session_id → 连接 WebSocket
    try {
      const resp = await fetch('/api/sessions', { method: 'POST' });
      const data = await resp.json();
      const sid = data.session_id;
      add('ai', `[会话: ${sid.slice(0, 8)}…]`);

      ws = new WebSocket(`ws://${location.host}/chat/${sid}`);
      ws.onopen = () => { connected = true; };
      ws.onmessage = (e) => {
        const evt = JSON.parse(e.data);
        switch (evt.type) {
          case 'history':
            evt.messages.forEach(m => {
              if (m.role === 'user') {
                add('user', typeof m.content === 'string' ? m.content : JSON.stringify(m.content));
              } else if (m.role === 'assistant') {
                const c = m.content;
                if (typeof c === 'string') add('ai', c);
                else if (Array.isArray(c)) {
                  c.forEach(b => {
                    if (b.type === 'tool_use') add('tool', `↳ ${b.name}(${JSON.stringify(b.input).slice(0,80)}…)`);
                    else if (b.type === 'text') add('ai', b.text);
                  });
                }
              }
            });
            break;
          case 'thinking': add('thinking', '思考中…'); break;
          case 'text': {
            const last = chat.lastElementChild;
            if (last && last.classList.contains('ai') && last.dataset.streaming === '1') {
              last.textContent += evt.text;
            } else {
              const el = add('ai', evt.text);
              el.dataset.streaming = '1';
            }
            break;
          }
          case 'tool_call':
            add('tool', `↳ ${evt.tool_name}(${JSON.stringify(evt.tool_input).slice(0, 80)}…)`); break;
          case 'tool_result':
            add('tool', `  ← ${evt.tool_name}: ${(evt.tool_content || '').slice(0, 120)}`); break;
          case 'waiting':
            if (chat.lastElementChild) chat.lastElementChild.dataset.streaming = '0'; break;
          case 'error':
            add('error', 'Error: ' + evt.message); break;
          case '_done': break;
          case 'permission_request':
            showPerm(evt.request_id, evt.tool_name, evt.inputs); break;
        }
        chat.scrollTop = chat.scrollHeight;
      };
      ws.onclose = () => { connected = false; add('error', '[连接断开]'); };
    } catch (err) {
      add('error', '连接失败: ' + err.message);
    }
  }

  function send() {
    const msg = ta.value.trim();
    if (!msg) return;
    if (!connected) connect();
    add('user', msg);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(msg);
    ta.value = ''; ta.style.height = 'auto';
  }

  function stop() {
    if (ws) { ws.send('{"type":"stop"}'); add('thinking', '[已停止]'); }
  }

  /* ---- 权限确认弹窗 ---- */
  let pendingPermId = null;

  function showPerm(rid, toolName, inputs) {
    pendingPermId = rid;
    document.getElementById('perm-title').textContent = '权限确认: ' + toolName;
    let html = '';
    for (const [k, v] of Object.entries(inputs)) {
      html += `<strong>${k}:</strong><pre>${escHtml(String(v))}</pre>`;
    }
    document.getElementById('perm-params').innerHTML = html;
    document.getElementById('perm-overlay').classList.add('show');
  }

  function resolvePerm(choice) {
    if (!pendingPermId || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({type: 'permission_response', request_id: pendingPermId, choice: choice}));
    document.getElementById('perm-overlay').classList.remove('show');
    pendingPermId = null;
    add('tool', `[权限: ${choice}]`);
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; });

  connect();
</script>
</body>
</html>
