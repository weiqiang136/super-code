[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "super-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
super-code = "tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
