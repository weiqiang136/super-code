[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-code-assistant"
version = "3.3.9"
description = "Minimal AI coding assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
super-code = "tui.app:main"

[tool.setuptools.package-data]
core = ["config_template.json"]

[tool.setuptools.packages.find]
where = ["src"]
