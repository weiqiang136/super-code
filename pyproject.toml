[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "super-code"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "pyaudio>=0.2.14",
    "webrtcvad>=2.0.10",
    "numpy>=1.24.0",
    "edge-tts>=6.1.0",
    "resemblyzer>=0.1.3",
    "pvporcupine>=3.0.0",
    "pydub>=0.25.1",
]

[project.scripts]
super-code = "tui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
